<svg xmlns="http://www.w3.org/2000/svg" width="750" height="1334" viewBox="0 0 750 1334" font-family="Geist, system-ui, sans-serif">
  <rect width="750" height="1334" fill="#f5f5f5"/>
  <rect width="750" height="160" fill="#ffffff"/>
  <text x="40" y="96" font-size="34" font-weight="600" fill="#262626">自动化</text>
  <text x="606" y="96" font-size="26" fill="#737373">编辑</text>
  <g>
    <rect x="40" y="200" width="670" height="170" rx="16" fill="#ffffff"/>
    <text x="68" y="252" font-size="28" font-weight="600" fill="#262626">回家自动开灯</text>
    <text x="68" y="296" font-size="22" fill="#737373">IF geofence.enter = true AND sun.state = down</text>
    <text x="68" y="332" font-size="22" fill="#a3a3a3">THEN light.livingroom.on, brightness = 80</text>
    <rect x="608" y="228" width="76" height="44" rx="22" fill="#0d9488"/>
    <circle cx="662" cy="250" r="16" fill="#ffffff"/>
  </g>
  <g>
    <rect x="40" y="390" width="670" height="170" rx="16" fill="#ffffff"/>
    <text x="68" y="442" font-size="28" font-weight="600" fill="#262626">离家断电</text>
    <text x="68" y="486" font-size="22" fill="#737373">IF geofence.exit = true AND delay = 300s</text>
    <text x="68" y="522" font-size="22" fill="#a3a3a3">THEN socket.all.off</text>
    <rect x="608" y="418" width="76" height="44" rx="22" fill="#e5e5e5"/>
    <circle cx="630" cy="440" r="16" fill="#ffffff"/>
  </g>
  <g>
    <rect x="40" y="580" width="670" height="170" rx="16" fill="#ffffff"/>
    <text x="68" y="632" font-size="28" font-weight="600" fill="#262626">睡眠模式</text>
    <text x="68" y="676" font-size="22" fill="#737373">IF time = 23:30 AND weekday in [1..5]</text>
    <text x="68" y="712" font-size="22" fill="#a3a3a3">THEN scene.sleep.run</text>
    <rect x="608" y="608" width="76" height="44" rx="22" fill="#e5e5e5"/>
    <circle cx="630" cy="630" r="16" fill="#ffffff"/>
  </g>
  <g>
    <rect x="40" y="770" width="670" height="170" rx="16" fill="#ffffff"/>
    <text x="68" y="822" font-size="28" font-weight="600" fill="#262626">湿度联动除湿</text>
    <text x="68" y="866" font-size="22" fill="#737373">IF sensor.humidity &gt; 70</text>
    <text x="68" y="902" font-size="22" fill="#a3a3a3">THEN dehumidifier.on</text>
    <rect x="608" y="798" width="76" height="44" rx="22" fill="#0d9488"/>
    <circle cx="662" cy="820" r="16" fill="#ffffff"/>
  </g>
  <text x="375" y="1010" font-size="22" fill="#a3a3a3" text-anchor="middle">共 4 条自动化</text>
  <rect x="40" y="1060" width="670" height="96" rx="16" fill="#e5e5e5"/>
  <text x="375" y="1118" font-size="28" fill="#525252" text-anchor="middle">+ 创建自动化</text>
  <rect y="1244" width="750" height="90" fill="#ffffff"/>
  <g font-size="22" fill="#a3a3a3">
    <text x="86" y="1298">首页</text>
    <text x="330" y="1298">设备</text>
  </g>
  <text x="566" y="1298" font-size="22" fill="#0d9488">自动化</text>
  <rect x="556" y="1264" width="80" height="4" rx="2" fill="#0d9488"/>
</svg>
